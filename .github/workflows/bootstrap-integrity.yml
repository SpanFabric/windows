name: Bootstrap integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  bootstrap-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify bootstrap control files
        shell: bash
        run: |
          test -s AGENTS.md
          test -s .spangpu/materialization-state.json
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('.spangpu/materialization-state.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_version']=='1.0'
          assert d['repository']
          assert d['builderkit_version']
          print('bootstrap state valid')
          PY
