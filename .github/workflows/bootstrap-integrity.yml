name: Bootstrap integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  bootstrap-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify bootstrap control files
        shell: bash
        run: |
          test -s AGENTS.md
          test -s .steward/verification-policy.yaml
          test -s verification/state.yaml
          test -s verification/reports/INITIAL_BASELINE_BOOTSTRAP_BUILDER.json
          python scripts/verify_review_state.py --check
          python -m unittest discover -s tests/verification -p 'test_*.py' -v
